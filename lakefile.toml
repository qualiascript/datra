name = "datra"
version = "0.1.0"
defaultTargets = ["datra"]

[[lean_lib]]
name = "Datra"
srcDir = "datra-lean"
roots = ["Semantics"]
globs = ["Semantics", "Executable.+"]

[[lean_lib]]
name = "datra"
globs = ["datra"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.24.0"
